[project]
name = "municipal-qa"
version = "0.1.0"
description = "Batch question answering over municipal source files with evidence"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stephen Nwankwo" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.16",
    "duckdb>=2.0.1",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "laspy[lazrs]>=2.7.0",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyogrio>=0.13.0",
    "pypdf>=7.1.1",
    "pyproj>=3.8.0",
    "python-dateutil>=4.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "rasterio>=1.5.2",
    "rich>=15.0.0",
    "shapely>=2.2.0",
    "typer>=0.29.2",
]

[project.scripts]
mqa = "municipal_qa.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "folium>=1.0.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/municipal_qa/schema.py" = ["UP042"]
