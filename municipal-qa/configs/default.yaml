data_dir: ${MQA_DATA_DIR}
artifacts_dir: artifacts
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:1.7b
  max_params: 3000000000
  options: {temperature: 0, seed: 42, num_ctx: 8192}
  think: false
  keep_alive: 10m
  num_predict: {route: 400, plan: 700, repair: 700, compose: 600, rewrite: 600}
budget:
  max_calls: 15
  max_generated_tokens: 12000
  reserve_tokens_for_compose: 800
retrieval:
  embedding_model: granite-embedding:278m   # Ollama BERT encoder, Apache-2.0, multilingual (D-052)
  reranker_model: null                       # no cross-encoder without tqdm/torch (D-052)
  embed_batch: 64
  rrf_k: 60
  max_per_source: 4   # hits per source in the top k, so multi-source questions see each file
  k_bm25: 30
  k_dense: 30
  k_final: 8
  docs_first: 3       # documentation passages placed ahead of other hits
  chunk_chars: 900
  chunk_overlap: 150
pipeline:
  mode: planner        # planner: route -> plan -> execute -> compose; baseline: M1 retrieve + compose
  max_repairs: 2
  max_extra_plans: 2
  enable_rewrite: true
  evidence_from_top: 4   # baseline: evidence lines from the top retrieved passages
run:
  workers: 1          # Ollama serialises anyway; profiling/indexing may use more
  resume: true
